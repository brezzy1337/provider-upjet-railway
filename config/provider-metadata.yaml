name: terraform-community-providers/railway
resources:
    railway_custom_domain:
        subCategory: ""
        description: Railway custom domain.
        name: railway_custom_domain
        title: railway_custom_domain Resource - terraform-provider-railway
        examples:
            - name: api
              manifest: |-
                {
                  "domain": "api.example.com",
                  "environment_id": "${railway_project.example.default_environment.id}",
                  "service_id": "${railway_service.example.id}"
                }
              references:
                environment_id: railway_project.example.default_environment.id
                service_id: railway_service.example.id
        argumentDocs:
            dns_record_value: (String) DNS record value of the custom domain.
            domain: (String) Custom domain.
            environment_id: (String) Identifier of the environment the custom domain belongs to.
            host_label: (String) Host label of the custom domain.
            id: (String) Identifier of the custom domain.
            project_id: (String) Identifier of the project the custom domain belongs to.
            service_id: (String) Identifier of the service the custom domain belongs to.
            target_port: (Number) Target port of the service for the custom domain.
            verification_host_label: (String) DNS host label for custom domain verification
            verification_record_value: (String) DNS record value for custom domain verification
            zone: (String) Zone of the custom domain.
        importStatements:
            - terraform import railway_custom_domain.api 89fa0236-2b1b-4a8c-b12d-ae3634b30d97:staging:example.com
    railway_environment:
        subCategory: ""
        description: Railway environment.
        name: railway_environment
        title: railway_environment Resource - terraform-provider-railway
        examples:
            - name: example
              manifest: |-
                {
                  "name": "staging",
                  "project_id": "${railway_project.example.id}"
                }
              references:
                project_id: railway_project.example.id
        argumentDocs:
            id: (String) Identifier of the environment.
            name: (String) Name of the environment.
            project_id: (String) Identifier of the project the environment belongs to.
        importStatements:
            - terraform import railway_environment.example 0bb01547-570d-4109-a5e8-138691f6a2d1:staging
    railway_project:
        subCategory: ""
        description: Railway project.
        name: railway_project
        title: railway_project Resource - terraform-provider-railway
        examples:
            - name: example
              manifest: |-
                {
                  "name": "something"
                }
        argumentDocs:
            default_environment: (Attributes) Default environment of the project. When multiple exist, the oldest is considered. (see below for nested schema)
            description: (String) Description of the project.
            has_pr_deploys: (Boolean) Whether the project has PR deploys enabled. Default false.
            id: (String) Identifier of the project.
            name: (String) Name of the project.
            private: (Boolean) Privacy of the project. Default true.
            workspace_id: (String) Identifier of the workspace the project belongs to. Required if the railway token has access to multiple workspaces.
        importStatements:
            - terraform import railway_project.example 0bb01547-570d-4109-a5e8-138691f6a2d1
    railway_service:
        subCategory: ""
        description: 'Railway service. ⚠️ NOTE: All the other settings not specified here are recommended to be specified in the Railway config file.'
        name: railway_service
        title: railway_service Resource - terraform-provider-railway
        examples:
            - name: example
              manifest: |-
                {
                  "name": "api",
                  "project_id": "${railway_project.example.id}"
                }
              references:
                project_id: railway_project.example.id
        argumentDocs:
            config_path: (String) Path to the Railway config file. Conflicts with source_image.
            cron_schedule: (String) Cron schedule of the service. Only allowed when total number of replicas across all regions is 1.
            id: (String) Identifier of the service.
            mount_path: (String) Mount path of the volume.
            name: (String) Name of the service.
            num_replicas: (Number) Number of replicas to deploy. Default 1.
            project_id: (String) Identifier of the project the service belongs to.
            region: (String) Region to deploy in.
            regions: (Attributes List) Regions with replicas to deploy service in. (see below for nested schema)
            root_directory: (String) Directory to user for the service. Conflicts with source_image.
            size: (Number) Size of the volume in MB.
            source_image: (String) Source image of the service. Conflicts with source_repo, source_repo_branch, root_directory and config_path.
            source_image_registry_password: (String, Sensitive) Private Docker registry credentials.
            source_image_registry_username: (String) Private Docker registry credentials.
            source_repo: (String) Source repository of the service. Conflicts with source_image.
            source_repo_branch: (String) Source repository branch to be used with source_repo. Must be specified if source_repo is specified.
            volume: (Attributes) Volume connected to the service. (see below for nested schema)
        importStatements:
            - terraform import railway_service.example 89fa0236-2b1b-4a8c-b12d-ae3634b30d97
    railway_service_domain:
        subCategory: ""
        description: Railway service domain.
        name: railway_service_domain
        title: railway_service_domain Resource - terraform-provider-railway
        examples:
            - name: api
              manifest: |-
                {
                  "environment_id": "${railway_project.example.default_environment.id}",
                  "service_id": "${railway_service.example.id}",
                  "subdomain": "example-api"
                }
              references:
                environment_id: railway_project.example.default_environment.id
                service_id: railway_service.example.id
        argumentDocs:
            domain: (String) Full domain of the service domain.
            environment_id: (String) Identifier of the environment the service domain belongs to.
            id: (String) Identifier of the service domain.
            project_id: (String) Identifier of the project the service domain belongs to.
            service_id: (String) Identifier of the service the service domain belongs to.
            subdomain: (String) Subdomain of the service domain.
            suffix: (String) Suffix of the service domain.
        importStatements:
            - terraform import railway_service_domain.api 89fa0236-2b1b-4a8c-b12d-ae3634b30d97:staging:example-api.up.railway.app
    railway_shared_variable:
        subCategory: ""
        description: Railway shared variable.
        name: railway_shared_variable
        title: railway_shared_variable Resource - terraform-provider-railway
        examples:
            - name: example
              manifest: |-
                {
                  "environment_id": "${railway_project.example.default_environment.id}",
                  "name": "SENTRY_KEY",
                  "project_id": "${railway_project.example.id}",
                  "value": "1234567890"
                }
              references:
                environment_id: railway_project.example.default_environment.id
                project_id: railway_project.example.id
        argumentDocs:
            environment_id: (String) Identifier of the environment the variable belongs to.
            id: (String) Identifier of the variable.
            name: (String) Name of the variable.
            project_id: (String) Identifier of the project the variable belongs to.
            value: (String, Sensitive) Value of the variable.
        importStatements:
            - terraform import railway_shared_variable.sentry 0bb01547-570d-4109-a5e8-138691f6a2d1:staging:SENTRY_KEY
    railway_tcp_proxy:
        subCategory: ""
        description: Railway TCP proxy.
        name: railway_tcp_proxy
        title: railway_tcp_proxy Resource - terraform-provider-railway
        examples:
            - name: redis
              manifest: |-
                {
                  "application_port": 6379,
                  "environment_id": "${railway_project.example.default_environment.id}",
                  "service_id": "${railway_service.example.id}"
                }
              references:
                environment_id: railway_project.example.default_environment.id
                service_id: railway_service.example.id
        argumentDocs:
            application_port: (Number) Port of the application the TCP proxy points to.
            domain: (String) Domain of the TCP proxy.
            environment_id: (String) Identifier of the environment the TCP proxy belongs to.
            id: (String) Identifier of the TCP proxy.
            proxy_port: (Number) Port of the TCP proxy.
            service_id: (String) Identifier of the service the TCP proxy belongs to.
        importStatements:
            - terraform import railway_tcp_proxy.redis 89fa0236-2b1b-4a8c-b12d-ae3634b30d97:d0519b29-5d12-4857-a5dd-76fa7418336c:227bc195-52fa-4d39-a872-a8cec0a0feca
    railway_variable:
        subCategory: ""
        description: Railway variable. Any changes in collection triggers service redeployment.
        name: railway_variable
        title: railway_variable Resource - terraform-provider-railway
        examples:
            - name: example
              manifest: |-
                {
                  "environment_id": "${railway_project.example.default_environment.id}",
                  "name": "SENTRY_KEY",
                  "service_id": "${railway_service.example.id}",
                  "value": "1234567890"
                }
              references:
                environment_id: railway_project.example.default_environment.id
                service_id: railway_service.example.id
        argumentDocs:
            environment_id: (String) Identifier of the environment the variable belongs to.
            id: (String) Identifier of the variable.
            name: (String) Name of the variable.
            project_id: (String) Identifier of the project the variable belongs to.
            service_id: (String) Identifier of the service the variable belongs to.
            value: (String, Sensitive) Value of the variable.
        importStatements:
            - terraform import railway_variable.sentry 89fa0236-2b1b-4a8c-b12d-ae3634b30d97:staging:SENTRY_KEY
    railway_variable_collection:
        subCategory: ""
        description: Railway variable collection. Group of variables managed as a whole. Any changes in collection triggers service redeployment.
        name: railway_variable_collection
        title: railway_variable_collection Resource - terraform-provider-railway
        examples:
            - name: example
              manifest: |-
                {
                  "environment_id": "${railway_project.example.default_environment.id}",
                  "service_id": "${railway_service.example.id}",
                  "variables": [
                    {
                      "name": "SENTRY_KEY",
                      "value": "KEY"
                    },
                    {
                      "name": "SENTRY_SECRET",
                      "value": "SECRET"
                    }
                  ]
                }
              references:
                environment_id: railway_project.example.default_environment.id
                service_id: railway_service.example.id
        argumentDocs:
            environment_id: (String) Identifier of the environment the variable collection belongs to.
            id: (String) Identifier of the variable collection.
            name: (String) Name of the variable.
            project_id: (String) Identifier of the project the variable collection belongs to.
            service_id: (String) Identifier of the service the variable collection belongs to.
            value: (String, Sensitive) Value of the variable.
            variables: (Attributes List) Collection of variables. (see below for nested schema)
        importStatements:
            - terraform import railway_variable_collection.sentry 89fa0236-2b1b-4a8c-b12d-ae3634b30d97:staging:SENTRY_KEY:SENTRY_SECRET
