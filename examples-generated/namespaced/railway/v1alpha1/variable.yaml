apiVersion: railway.m.crossplane.io/v1alpha1
kind: Variable
metadata:
  annotations:
    meta.upbound.io/example-id: railway/v1alpha1/variable
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    environmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: SENTRY_KEY
    serviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    valueSecretRef:
      key: example-key
      name: example-secret
