apiVersion: railway.crossplane.io/v1alpha1
kind: CustomDomain
metadata:
  annotations:
    meta.upbound.io/example-id: railway/v1alpha1/customdomain
  labels:
    testing.upbound.io/example-name: api
  name: api
spec:
  forProvider:
    domain: api.example.com
    environmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    serviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
