apiVersion: railway.crossplane.io/v1alpha1
kind: SharedVariable
metadata:
  annotations:
    meta.upbound.io/example-id: railway/v1alpha1/sharedvariable
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    environmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: SENTRY_KEY
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    valueSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
