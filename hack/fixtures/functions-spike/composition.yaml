# Harness fixture for hack/native-cluster.sh verify (Phase 3, item 1). Not a
# product API. The default, hermetic round trip: one pipeline step renders a
# core ConfigMap through function-go-templating (Crossplane 2 composes any
# Kubernetes resource; the ConfigMap lands in the XR's namespace) and
# function-auto-ready marks the XR Ready once the ConfigMap exists. No provider
# and no external API is involved, so every verify can run it.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xspike-configmap
spec:
  compositeTypeRef:
    apiVersion: harness.railway.crossplane.io/v1alpha1
    kind: XSpike
  mode: Pipeline
  pipeline:
  - step: render
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: config
          data:
            name: {{ .observed.composite.resource.spec.name | quote }}
  - step: ready
    functionRef:
      name: function-auto-ready
