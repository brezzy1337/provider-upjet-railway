# Harness fixture for hack/native-cluster.sh verify (Phase 3, item 1). Not a
# product API. The opt-in XR (VERIFY_LIVE_RAILWAY=1): selects the Composition
# that renders a real Railway Project. The namespace functions-spike is created
# by verify.
apiVersion: harness.railway.crossplane.io/v1alpha1
kind: XSpike
metadata:
  name: spike-railway
  namespace: functions-spike
spec:
  name: upjet-functions-spike
  crossplane:
    compositionRef:
      name: xspike-railway-project
